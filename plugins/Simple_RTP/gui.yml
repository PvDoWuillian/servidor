# Simple RTP GUI config
#
# World icons use PLAYER_HEAD plus a texture value.
# If you do not want custom heads, change material to a normal block and remove the texture.
# This uses MiniMessage (You can use hex codes: e.g  <color:#00B837>), & or legacy colour codes.

